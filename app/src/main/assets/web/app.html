    <!-- END AUTO-GENERATED LEADING SHAPES -->

    <div id="shell" class="fk-shell"
         data-rail-side="left" data-swap="0" data-panel="shown" data-mobile-dest="chat">

        <nav class="fk-pillar fk-pillar--rail" aria-label="主导航">
            <img class="fk-rail-logo" src="/static/flikky-logo-slow.svg" alt="Flikky">
            <div class="fk-rail-items" id="rail-items">
                <button class="fk-rail-item" data-dest="files" aria-current="false" hidden>
                    <span class="fk-rail-icon"><span class="material-symbols-outlined" data-icon="folder" aria-hidden="true"></span></span>
                    <span data-i18n="app.nav.files">文件</span>
                </button>
                <button class="fk-rail-item" data-dest="album" aria-current="false" hidden>
                    <span class="fk-rail-icon"><span class="material-symbols-outlined" data-icon="photo_library" aria-hidden="true"></span></span>
                    <span data-i18n="app.nav.album">相册</span>
                </button>
                <button class="fk-rail-item" data-dest="favorites" aria-current="false" hidden>
                    <span class="fk-rail-icon"><span class="material-symbols-outlined" data-icon="star" aria-hidden="true"></span></span>
                    <span data-i18n="app.nav.favorites">收藏</span>
                </button>
                <button class="fk-rail-item" data-dest="settings" aria-current="false">
                    <span class="fk-rail-icon"><span class="material-symbols-outlined" data-icon="settings" aria-hidden="true"></span></span>
                    <span data-i18n="app.nav.settings">设置</span>
                </button>
            </div>
            <button class="fk-rail-avatar" id="my-avatar-btn"
                    aria-label="我的头像，点击更换" data-i18n-aria-label="app.my_avatar"
                    data-i18n-title="app.avatar.change" type="button"></button>
        </nav>

        <section class="fk-pillar fk-pillar--chat" aria-label="会话">
            <header class="fk-chat-head" id="header-peer" aria-label="对方信息" data-i18n-aria-label="app.peer_info">
                <div class="avatar-circle" id="peer-avatar" aria-label="对方头像" data-i18n-aria-label="app.peer_avatar"></div>
                <div class="fk-chat-peer"><span class="header-peer-name" id="peer-name"></span></div>
                <span class="fk-chat-stats">
                    <span id="uptime">00:00</span><span id="count">0 个文件</span><span id="rate">0 B/s</span>
                </span>
                <mdui-chip id="conn" data-i18n="app.connecting" variant="assist" selected>连接中…</mdui-chip>
            </header>

            <div id="chat-list-shell" class="chat-list-shell">
                <div id="list" class="chat-list flikky-scroll"></div>
            </div>

            <div class="fk-dock-row">
                <div class="fk-dock" id="dock">
                    <input type="file" id="file-picker" multiple style="display:none">
                    <button class="fk-dock-btn" id="file-btn" aria-label="附件" data-i18n-aria-label="app.attach" type="button">
                        <span class="material-symbols-outlined" data-icon="attach_file" aria-hidden="true"></span>
                    </button>
                    <textarea class="fk-dock-input" id="text-input" rows="1"
                              aria-label="消息" data-i18n-aria-label="app.message"
                              placeholder="输入消息" data-i18n-placeholder="app.message_placeholder"></textarea>
                    <button class="fk-send" id="send-btn" data-ready="false" aria-label="发送" data-i18n-aria-label="app.send" type="button">
                        <span class="material-symbols-outlined" data-icon="arrow_upward" aria-hidden="true"></span>
                    </button>
                </div>
                <button class="fk-fab" id="save-all-fab" type="button" hidden data-hidden-animated
                        aria-label="保存所有文件" data-i18n-aria-label="app.save_all"
                        aria-controls="save-all-dropdown" aria-expanded="false">
                    <span class="material-symbols-outlined" data-icon="download" aria-hidden="true"></span>
                </button>
            </div>

            <!-- 自绘菜单：视觉比 mdui-menu 更贴这套设计（用户明确要求保留原型这版）。
                 这其实是个普通的 disclosure，不是 ARIA menu——两个原生 <button> 走
                 Tab 顺序、Enter 激活、Esc 关闭，没有方向键导航/roving tabindex，
                 所以不声称 menu / menuitem 那套角色语义，只用 aria-controls 关联容器。 -->
            <div class="fk-fab-menu" id="save-all-dropdown" hidden>
                <button class="fk-fab-menu-item" id="save-all-each" type="button" style="--i:0">
                    <span class="material-symbols-outlined" data-icon="file_download" aria-hidden="true"></span>
                    <span id="save-all-each-label"></span>
                </button>
                <button class="fk-fab-menu-item" id="save-all-zip" type="button" style="--i:1">
                    <span class="material-symbols-outlined" data-icon="folder_zip" aria-hidden="true"></span>
                    <span data-i18n="app.save_all_zip">打包为 ZIP</span>
                </button>
            </div>
        </section>

        <div class="fk-splitter" id="splitter" role="separator"
             aria-orientation="vertical" tabindex="0"></div>

        <section class="fk-pillar fk-pillar--panel" aria-label="功能面板">
            <div class="fk-view" id="view-files" hidden></div>
            <section class="fk-view" id="view-album" hidden></section>
            <div class="fk-view" id="view-favorites" hidden>
                <header class="fk-panel-head">
                    <h1 class="fk-panel-title" data-i18n="app.nav.favorites">收藏</h1>
                    <!-- 排序：触发按钮与菜单是**兄弟**，不套 mdui-dropdown。
                         mdui-dropdown 在这套分栏布局里会被 .fk-pillar 的
                         overflow: hidden 裁切（2026-09-08 装机反馈：菜单跑到
                         按钮右边、感觉和按钮是分开的）。定位由 sort-menu.js
                         接管，菜单打开时被移到 body 上；容器与菜单项仍是官方
                         mdui-menu。 -->
                    <button class="fk-icon-btn" id="fav-sort" type="button" aria-haspopup="true"
                            aria-label="排序" data-i18n-aria-label="app.favorites.sort">
                        <span class="material-symbols-outlined" data-icon="filter_list" aria-hidden="true"></span>
                    </button>
                    <mdui-menu id="fav-sort-menu" hidden>
                        <mdui-menu-item class="fk-sort-item" value="NAME"
                                        data-i18n="app.favorites.sortName">按名称</mdui-menu-item>
                        <mdui-menu-item class="fk-sort-item" value="TIME"
                                        data-i18n="app.favorites.sortTime">按收藏时间</mdui-menu-item>
                        <mdui-menu-item class="fk-sort-item" value="SIZE"
                                        data-i18n="app.favorites.sortSize">按大小</mdui-menu-item>
                    </mdui-menu>
                    <button class="fk-icon-btn" id="fav-refresh" type="button"
                            aria-label="刷新" data-i18n-aria-label="app.favorites.refresh">
                        <span class="material-symbols-outlined" data-icon="refresh" aria-hidden="true"></span>
                    </button>
                    <button class="fk-icon-btn fk-panel-collapse" type="button"
                            aria-label="收起功能栏" data-i18n-aria-label="app.settings.collapse">
                        <span class="material-symbols-outlined" data-icon="close" aria-hidden="true"></span>
                    </button>
                </header>
                <div class="fk-panel-body flikky-scroll">
                    <div class="fk-search">
                        <span class="material-symbols-outlined" data-icon="search" aria-hidden="true"></span>
                        <input type="text" id="fav-search"
                               aria-label="搜索收藏" data-i18n-aria-label="app.favorites.search"
                               placeholder="搜索收藏" data-i18n-placeholder="app.favorites.search">
                    </div>
                    <div class="fk-chips" id="fav-chips"></div>
                    <div id="fav-list"></div>
                </div>
                <div class="fk-toolbar" id="fav-toolbar" hidden>
                    <span class="fk-toolbar-count" id="fav-count"></span>
                    <button class="fk-icon-btn" id="fav-clear" type="button"
                            aria-label="清除选择" data-i18n-aria-label="app.favorites.clear">
                        <span class="material-symbols-outlined" data-icon="close" aria-hidden="true"></span>
                    </button>
                    <!-- 主操作排在最后（最右），并用 --filled 变体，与原型一致 -->
                    <button class="fk-icon-btn fk-icon-btn--filled" id="fav-save-selected" type="button"
                            aria-label="保存所选" data-i18n-aria-label="app.favorites.saveSelected">
                        <span class="material-symbols-outlined" data-icon="download" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
            <div class="fk-view" id="view-settings"></div>
        </section>
    </div>

    <nav class="fk-navbar" id="navbar" aria-label="主导航">
        <button class="fk-navbar-item" data-dest="chat" aria-current="page">
            <span class="fk-navbar-icon"><span class="material-symbols-outlined" data-icon="forum" aria-hidden="true"></span></span>
            <span data-i18n="app.nav.chat">会话</span>
        </button>
        <button class="fk-navbar-item" data-dest="files" aria-current="false" hidden>
            <span class="fk-navbar-icon"><span class="material-symbols-outlined" data-icon="folder" aria-hidden="true"></span></span>
            <span data-i18n="app.nav.files">文件</span>
        </button>
        <button class="fk-navbar-item" data-dest="album" aria-current="false" hidden>
            <span class="fk-navbar-icon"><span class="material-symbols-outlined" data-icon="photo_library" aria-hidden="true"></span></span>
            <span data-i18n="app.nav.album">相册</span>
        </button>
        <button class="fk-navbar-item" data-dest="favorites" aria-current="false" hidden>
            <span class="fk-navbar-icon"><span class="material-symbols-outlined" data-icon="star" aria-hidden="true"></span></span>
            <span data-i18n="app.nav.favorites">收藏</span>
        </button>
        <button class="fk-navbar-item" data-dest="settings" aria-current="false">
            <span class="fk-navbar-icon"><span class="material-symbols-outlined" data-icon="settings" aria-hidden="true"></span></span>
            <span data-i18n="app.nav.settings">设置</span>
        </button>
    </nav>

    <!-- Avatar picker (12 presets) — official mdui-dialog -->
    <mdui-dialog id="avatar-picker" close-on-overlay-click close-on-esc headline="选择头像" data-i18n-headline="app.choose_avatar">
        <div class="avatar-picker-grid" id="avatar-picker-grid"></div>
    </mdui-dialog>

    <mdui-dialog id="connection-dialog">
        <span slot="icon" class="material-symbols-outlined" data-icon="signal_disconnected" aria-hidden="true"></span>
        <div slot="headline" data-i18n="app.disconnected">已断开</div>
        <div id="connection-dialog-message" role="status" aria-live="assertive"></div>
    </mdui-dialog>

    <!-- v1.3 D26: 撤回二次确认 dialog。两端一致：手机端 AlertDialog ⇄ 浏览器 mdui-dialog -->
    <mdui-dialog id="recall-confirm-dialog" close-on-overlay-click="true" close-on-esc="true" headline="撤回这条消息？" data-i18n-headline="app.recall_title">
        <div data-i18n="app.recall_body" style="padding: 0 24px 8px;">撤回后两端都会消失，不可恢复。</div>
        <mdui-button slot="action" data-action="cancel" data-i18n="common.cancel" variant="text">取消</mdui-button>
        <mdui-button slot="action" data-action="confirm" data-i18n="app.recall" variant="text">撤回</mdui-button>
    </mdui-dialog>

    <mdui-snackbar id="snackbar" placement="top"></mdui-snackbar>

    <div id="drop-overlay" class="drop-overlay" hidden>
        <div class="drop-overlay-card" data-i18n="app.drop_hint">松开以发送文件</div>
    </div>

    <div id="lightbox" class="lightbox" hidden>
        <button id="lightbox-close" class="lightbox-close" aria-label="关闭预览" data-i18n-aria-label="app.close_preview" type="button">
            <span class="material-symbols-outlined" data-icon="close" aria-hidden="true"></span>
        </button>
        <div id="lightbox-content" class="lightbox-content"></div>
    </div>

    <script src="/static/vendor/mdui.global.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/snackbar.js"></script>
    <script src="/static/leading-types.js"></script>
    <script src="/static/leading.js"></script>
    <script src="/static/app.js"></script>
    <script src="/static/sort.js"></script>
    <script src="/static/sort-menu.js"></script>
    <script src="/static/panel-settings.js"></script>
    <script src="/static/panel-favorites.js"></script>
    <script src="/static/panel-files.js"></script>
    <script src="/static/panel-album.js"></script>
</body>
</html>
